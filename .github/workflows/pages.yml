name: Deploy StudyFlyway default theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build default StudyFlyway website
        run: node prepare.js
      - name: Validate generated university pages
        run: node scripts/check-universities.js --dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
