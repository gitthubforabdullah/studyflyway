name: Review information sources
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: read
concurrency:
  group: source-review
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check official source availability
        run: node scripts/audit-sources.js
      - name: Save source review report
        uses: actions/upload-artifact@v7
        with:
          name: information-source-review
          path: research/source-audit.json
          retention-days: 30
          if-no-files-found: error
